{% extends 'base.html'%}

{% block body %}
{% if form.errors %}
<div class="error">
    {% for field in form %}
        {% for error in field.errors %}
            <p>{{ error }}</p>
        {% endfor %}
    {% endfor %}
</div>
{% endif %}
<form method="post">
{% csrf_token %}
{{ form.as_p }}
<button type="submit" class="btn btn-success">Giriş Yap</button>
<a href="/register" class="btn btn-info"> Kayıt Yap</a>
</form>
{% endblock %}
