<!DOCTYPE html>
<html>

<head>
    <title>Leaflet Different Projections</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.7.5/proj4.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4leaflet/1.0.2/proj4leaflet.js"></script>
    <style>
        #map {
            height: 1000px;
            z-index: 1;
            padding-top: 110px
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script>
        // Farklı projeksiyonları tanımlama
        var crs3857 = L.CRS.EPSG3857;
        var crs4326 = new L.Proj.CRS('EPSG:4326',
            '+proj=longlat +datum=WGS84 +no_defs',
            {
                resolutions: [1, 0.5, 0.25, 0.125, 0.0625]
            }
        );

        var crs3395 = new L.Proj.CRS('EPSG:3395',
            '+proj=merc +lon_0=0 +k=1 +x_0=0 +y_0=0 +datum=WGS84 +units=m +no_defs',
            {
                resolutions: [8192, 4096, 2048, 1024, 512, 256, 128, 64, 32, 16, 8, 4, 2, 1, 0.5]
            }
        );
        var crs23036 = new L.Proj.CRS('EPSG:23036',
            '+proj=utm +zone=36 +ellps=intl +towgs84=-87,-98,-121,0,0,0,0 +units=m +no_defs',
            {
                resolutions: [8192, 4096, 2048, 1024, 512, 256, 128, 64, 32, 16, 8, 4, 2, 1, 0.5]
            }
        );
        // Haritayı oluşturma
        var map = L.map('map', {
            center: [0, 0],
            zoom: 2,
            layers: []
        });

        // TileLayer'ları oluşturma
        var layer3857 = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            crs: crs3857
        });

        var layer4326 = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            crs: crs4326
        });

        var layer3395 = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            crs: crs3395
        });

        var layer23036 = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            crs: crs23036
        });

        // Katman kontrolünü ekleme
        var baseMaps = {
            "EPSG:3857 (Web Mercator)": layer3857,
            "EPSG:4326 (WGS 84)": layer4326,
            "EPSG:3395 (Mercator)": layer3395,
            "EPSG:23036 (Mercator)": layer23036
        };

        L.control.layers(baseMaps).addTo(map);

        // Varsayılan katmanı ekleme
        layer23036.addTo(map);
        map.on('click', function (e) {
            var latlng = e.latlng
            console.log(latlng.lat, latlng.lng)
        });
    </script>
</body>

</html>
