{% load static %}
<!DOCTYPE>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

  <script src="{% static 'js/leaflet/leaflet.js' %}"></script>
  <script src="{% static 'js/leaflet/georaster.browser.bundle.min.js' %}"></script>
  <script src="{% static 'js/leaflet/proj4.js' %}"></script>
  <script src="{% static 'js/leaflet/proj4leaflet.js' %}"></script>
  <script src="{% static 'js/leaflet/georaster-layer.js' %}"></script>
  <!-- <script src="{% static 'leaflet/shpfile.js' %}"></script>
  <script src="{% static 'leaflet/shp.min.js' %}"></script> -->
  <script src="https://unpkg.com/shpjs/dist/shp.js"></script>
  <script src="https://unpkg.com/shpjs/dist/shp.min.js"></script>
  <script src="https://unpkg.com/leaflet.filelayer/dist/leaflet.filelayer.js"></script>
  <script src="https://unpkg.com/mapshaper/dist/mapshaper.min.js"></script>



  <style>
    #map {
      bottom: 0;
      left: 0;
      position: fixed;
      right: 0;
      top: 0;
    }

    #map {
      z-index: 8;
    }

    .overlay {
      background: rgba(0, 120, 0, 0);
      padding: 1px;
      z-index: 0;
      ;
    }

    .form-inline {
      display: flex;
      align-items: center;
      position: fixed;
      top: 0;
      left: 8%;
      background: rgba(117, 102, 60, 0.733);
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      z-index: 9;
      pointer-events: auto;
    }

    .form-inline input,
    .form-inline button {
      margin-right: 10px;
    }


    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgb(0, 0, 0);
      background-color: rgba(0, 0, 0, 0.4);
      padding-top: 60px;
    }

    .modal-content {
      background-color: #fefefe;
      margin: 5% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }

    .close:hover,
    .close:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
  </style>



</head>

<body>
  <h2>Map with Shapefile</h2>
  <div id="map"></div>
  <script>
    // EPSG:23033 (ED50 UTM Zone 33N) projeksiyon tanımlaması
    var crs23033 = new L.Proj.CRS('EPSG:23033',
      '+proj=utm +zone=33 +ellps=intl +datum=ED50 +units=m +no_defs',
      {
        resolutions: [8192, 4096, 2048, 1024, 512, 256, 128, 64, 32, 16, 8, 4, 2, 1, 0.5]
      }
    );
    var map = L.map('map', { crs: crs23033, }).setView([36.970796, 35.344973], 9);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    fetch('/upload_shapefile/', {
      method: 'POST',
      body: new FormData(document.querySelector('form'))
    })
      .then(response => response.json())
      .then(data => {
        L.geoJSON(data).addTo(map);
      })
      .catch(error => console.error(error));
  </script>

</body>

</html>
