<!DOCTYPE>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <style>
    #map {
      bottom: 0;
      left: 0;
      position: fixed;
      right: 0;
      top: 0;
    }

    #map {
      z-index: 8;
    }

    .overlay {
      background: rgba(0, 120, 0, 0);
      padding: 1px;
      z-index: 0;
      ;
    }

    .form-inline {
      display: flex;
      align-items: center;
      position: fixed;
      top: 0;
      left: 8%;
      background: rgba(117, 102, 60, 0.733);
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      z-index: 9;
      pointer-events: auto;
    }

    .form-inline input,
    .form-inline button {
      margin-right: 10px;
    }


    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgb(0, 0, 0);
      background-color: rgba(0, 0, 0, 0.4);
      padding-top: 60px;
    }

    .modal-content {
      background-color: #fefefe;
      margin: 5% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }

    .close:hover,
    .close:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
  </style>


  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://unpkg.com/georaster"></script>
  <script src="https://unpkg.com/proj4"></script>
  <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>
  <script>


  </script>
</head>

<body>
  <!-- Modal -->
  <div id="infoModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <form id="infoForm">
        
        <input type="text" readonly id="lat" name="lat">
        <input type="text" readonly id="lon" name="lon">
        <label for="info">Enter info:</label><br>
        <input type="text" id="info" name="info"><br>
        <input type="button" value="Save" onclick="saveInfo()">
      </form>
    </div>
  </div>
  <form id="coordinate-form" class="form-inline ">
    <input type="file" id="geotiff-file" class="overlay">
    {% csrf_token %}
    lan: {{form.latitude}}
    lon:{{form.longitude}}
    bilgi:{{form.info}}
    <!-- #region -->

    <!-- {{ form.as_p }}-->

    <!--#endregion-->
    <button type="submit">Save Location</button>
  </form>
  <div id="map">
  </div>
  <script>
    // initalize leaflet map
    var map = L.map('map').setView([36.363245618141725, 34.03564453125001], 10);
var marker;
    // add OpenStreetMap basemap
    L.tileLayer('http://{s}.tile.osm.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap</a> contributors',
      opacity: 0.8,
      zoomControl: false,
    }).addTo(map);

    document.getElementById('coordinate-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            var formData = new FormData(this);
           
            fetch('/add_location/', {
                method: 'POST',
                body: new URLSearchParams(formData),
                headers: {
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                }
            }).then(response => response.json())
              .then(data => {
                  if (data.status === 'success') {

                      alert('Location saved!'+" - "+data);
                      location.reload();
                  } else {
                      alert('Failed to save location');
                      console.log(data.errors); // Hata mesajlarını konsola yazdır
                  }
              })
              .catch(error => {
                  console.error('Error:', error);
              });
        });

        
    // Modal control
    var modal = document.getElementById("infoModal");
    var span = document.getElementsByClassName("close")[0];
    var removeBtn = document.getElementById("removeBtn");
    
    



    map.on('click', function (e) {

      var lat = e.latlng.lat;
      var lon = e.latlng.lng;
     marker =  L.marker([lat, lon]).addTo(map);

      console.log("Latitude:", lat, "Longitude:", lon);

      document.getElementById("lat").value = lat;
      document.getElementById("lon").value = lon;

      console.log("Modal element:", modal);
      console.log("Lat element:", document.getElementById("lat"));
      console.log("Lon element:", document.getElementById("lon"));

      modal.style.display = "block";
      console.log("Modal display style set to block");
    });

    
    span.onclick = function () {
      modal.style.display = "none";
      map.removeLayer(marker)
    }

   
   
    window.onclick = function (event) {
      if (event.target == modal) {
        modal.style.display = "none";
        map.removeLayer(marker)
      }
    }

    document.getElementById("geotiff-file").addEventListener("change", function (event) {
      var file = event.target.files[0];
      console.log("file:", file);

      var reader = new FileReader();
      reader.readAsArrayBuffer(file);
      reader.onloadend = function () {
        var arrayBuffer = reader.result;
        parseGeoraster(arrayBuffer).then(georaster => {

          console.log("georaster:", georaster);
          /*
              GeoRasterLayer is an extension of GridLayer,
              which means can use GridLayer options like opacity.
  
              Just make sure to include the georaster option!
  
              http://leafletjs.com/reference-1.2.0.html#gridlayer
          */
          var layer = new GeoRasterLayer({
            georaster: georaster,
            opacity: 0.9,
            resolution: 256
          });
          console.log("layer:", layer);
          layer.addTo(map);

          map.fitBounds(layer.getBounds());
          //  document.getElementById("overlay").style.display = "none";
        });
      };
    });



    function saveInfo() {
      var lat = document.getElementById("lat").value;
      var lon = document.getElementById("lon").value;
      var info = document.getElementById("info").value;

      var formData = new FormData();
      formData.append('lat', lat);
      formData.append('lon', lon);
      formData.append('info', info);
      formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

      fetch('/add_location/', {
        method: 'POST',
        body: formData
      })
        .then(response => response.json())
        .then(data => {
          if (data.status === 'success') {
            alert('Location saved!');
          } else {
            alert('Failed to save location');
          }
          modal.style.display = "none";
        })
        .catch(error => console.error('Error:', error));
    }

    // Kaydedilen konumları haritada göster
    var locations = JSON.parse('{{ locations_json|escapejs }}');

    locations.forEach(function (location) {

      var latitude = location.fields.latitude;
      var longitude = location.fields.longitude;
      var info = location.fields.info;
      L.marker([latitude, longitude])
      .addTo(map)
      .bindPopup("<table ><thead><tr><th>KUYU BİLGİLERİ</th><tr></thead><tbody><tr><td>"+info+"</td></tr><tr><td>"+latitude+"</td></tr><tr><td>"+longitude+"</td></tr></tbody><tfoot><tr><td ><a href='#' id='removeBtn'   >SİL</a></td></tr></tfoot</table>");
    
    
        window.onload = function(){ 
      removeBtn.onclick = function () {      
      map.removeLayer(marker);
    }

};
    
      });

    
  </script>
</body>

</html>
