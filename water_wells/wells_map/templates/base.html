{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>{% block title %}{{title}}{% endblock %}</title>
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <!-- Bootstrap CSS -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

   <!-- DataTables CSS -->
   <link rel="stylesheet" href="https://cdn.datatables.net/1.10.21/css/dataTables.bootstrap4.min.css">
   <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
   <link rel="stylesheet" href="{% static 'css/all.min.css' %}" />

   <link rel="stylesheet" href="{% static 'css/leaflet-sidebar.min.css' %}">

   <!-- jQuery -->
   <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
   <script src="{% static 'js/leaflet/leaflet.js' %}"></script>
   <script src="{% static 'js/leaflet/leaflet-provider.js' %}"></script>
   <script src="{% static 'js/leaflet/georaster.browser.bundle.min.js' %}"></script>

   <script src="{% static 'js/leaflet/proj4.js' %}"></script>
   <script src="{% static 'js/leaflet/proj4leaflet.js' %}"></script>
   <script src="{% static 'js/leaflet/georaster-layer.js' %}"></script>
   <script src="{% static 'js/leaflet/leaflet-sidebar.min.js' %}"></script>
   <script src="{% static 'js/leaflet/leaflet-draw.js' %}"></script>

   <!-- KMZ JS -->
   <!-- <script src="https://unpkg.com/tokml"></script>
   <script src="{% static 'js/kmz/jszip.min.js' %}"></script>
   <script src="{% static 'js/kmz/papaparse.min.js' %}"></script> -->
   <script src="https://unpkg.com/leaflet-kml"></script>
   <script src="https://unpkg.com/tokml"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.6.0/jszip.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>


   <!-- <script src="{% static 'leaflet/shpfile.js' %}"></script>
  <script src="{% static 'leaflet/shp.min.js' %}"></script> -->
   <script src="https://unpkg.com/shpjs/dist/shp.js"></script>
   <script src="https://unpkg.com/shpjs/dist/shp.min.js"></script>
   <script src="https://unpkg.com/leaflet.filelayer/dist/leaflet.filelayer.js"></script>
   <script src="https://unpkg.com/mapshaper/dist/mapshaper.min.js"></script>
   <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>



   {% block extra_head %}{% endblock %}
</head>

<body>

  

   {% if user.is_authenticated %}
   {% include 'navbar/header.html'%}
   {% endif %}

   {% block body %}
   {% endblock %}

   <!-- Popper.js -->
   <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>

   <!-- DataTables JS -->
   <script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>
   <script src="https://cdn.datatables.net/1.10.21/js/dataTables.bootstrap4.min.js"></script>


  
   {% block extra_scripts %}{% endblock %}
</body>

</html>
