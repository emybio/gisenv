<!DOCTYPE html>
<html>

<head>
    <title>Leaflet Map with JSON Data</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map {
            height: 500px;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script>
        // Haritayı başlat
        var map = L.map('map').setView([37.0, 35.0], 10); // Harita koordinatları ve zoom seviyesi

        // Temel katman ekleyin
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // JSON dosyasını yükleyin
        fetch('static/json/complete_parsel_data_bounds_partial.json')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    style: function (feature) {
                        return { color: '#ff7800', weight: 2 };
                    },
                    onEachFeature: function (feature, layer) {
                        layer.bindPopup(Object.keys(feature.properties).map(key => `${key}: ${feature.properties[key]}`).join('<br>'));
                    }
                }).addTo(map);
            })
            .catch(error => console.error('Error loading the JSON file:', error));
    </script>
</body>

</html>
