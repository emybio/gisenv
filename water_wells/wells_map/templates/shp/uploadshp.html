{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Upload Shapefile</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

    <script src="{% static 'js/leaflet/leaflet.js' %}"></script>
    <script src="{% static 'js/leaflet/georaster.browser.bundle.min.js' %}"></script>
    <script src="{% static 'js/leaflet/proj4.js' %}"></script>
    <script src="{% static 'js/leaflet/proj4leaflet.js' %}"></script>
    <script src="{% static 'js/leaflet/georaster-layer.js' %}"></script>
    <!-- <script src="{% static 'leaflet/shpfile.js' %}"></script>
    <script src="{% static 'leaflet/shp.min.js' %}"></script> -->
    <script src="https://unpkg.com/shpjs/dist/shp.js"></script>
    <script src="https://unpkg.com/shpjs/dist/shp.min.js"></script>
    <script src="https://unpkg.com/leaflet.filelayer/dist/leaflet.filelayer.js"></script>
    <script src="https://unpkg.com/mapshaper/dist/mapshaper.min.js"></script>
    <style>
        #map {
            height: 600px;
        }
    </style>
</head>

<body>
    <h2>Map with Shapefile</h2>
    <form id="shapefile-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label>Select SHP File:</label>
        <input type="file" name="shapefile" accept=".shp" required><br>
        <label>Select DBF File:</label>
        <input type="file" name="dbffile" accept=".dbf" required><br>
        <button type="submit">Upload</button>
    </form>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([36.970796, 35.344973], 9);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    // Does this cookie string begin with the name we want?
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');
        document.getElementById('shapefile-form').addEventListener('submit', function (event) {
            event.preventDefault();
            var form = event.target;
            var formData = new FormData(form);

            fetch('/upload_shapefile/', {
                method: 'POST',
                headers: { 'X-CSRFToken': csrftoken },
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    console.log('GeoJSON URL:', data.geojson_url);
                    var geojsonUrl = data.geojson_url;
                    fetch(geojsonUrl)
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('Network response was not ok');
                            }
                            return response.json();
                        })
                        .then(geojsonData => {
                            console.log('GeoJSON Data:', geojsonData);
                            L.geoJSON(geojsonData).addTo(map);
                        })
                        .catch(error => console.error('Error fetching GeoJSON:', error));
                })
                .catch(error => console.error('Error uploading shapefile:', error));
        });
    </script>
</body>

</html>
